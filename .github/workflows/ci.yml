name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system dependencies
        run: |
          # Chrome is not a build dependency; its index can block apt updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libnotify-dev \
            libcanberra-dev \
            libx11-dev \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libfontconfig-dev \
            libonig-dev \
            xdotool \
            x11-xkb-utils \
            openbox \
            zsh \
            xvfb

      - name: Build
        run: zig build

      - name: Unit tests
        run: G_DEBUG=fatal-criticals GTK_A11Y=none xvfb-run -a zig build test

      - name: Codex wrapper tests
        run: python3 -m unittest discover -s tests -v

      - name: E2E tests
        run: xvfb-run zig build e2e

      - name: Ghostty embedding tests
        run: xvfb-run python3 -m unittest discover -s tests -p 'test_ghostty_integration.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Keyboard remap tests
        run: python3 -m unittest discover -s tests -p 'test_keyboard_remaps.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Pane close tests
        run: python3 -m unittest discover -s tests -p 'test_pane_close.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Socket robustness tests
        run: xvfb-run -a python3 -m unittest discover -s tests -p 'test_socket_server.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Fullscreen tests
        run: python3 -m unittest discover -s tests -p 'test_fullscreen.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Shell integration tests
        run: xvfb-run -a python3 -m unittest discover -s tests -p 'test_shell_integration.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: IME tests
        run: python3 -m unittest discover -s tests -p 'test_ime.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance
